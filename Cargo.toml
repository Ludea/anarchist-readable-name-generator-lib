[package]
name = "anarchist-readable-name-generator-lib"
description = "Generate a readable name from something with famous anarchist writers"
version = "0.2.2"
edition = "2024"
license = "CC0-1.0"
repository = "https://codeberg.org/PurpleBooth/anarchist-readable-name-generator-lib"
keywords = ["names", "utility"]
categories = ["development-tools::testing"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
rand = "^0.9.0"
[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
strip = "symbols"

[dev-dependencies]
rand_chacha = "=0.9.0"
